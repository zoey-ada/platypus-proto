syntax = "proto3";
package platypus;

import "common.proto";

message Settings {
    RendererSettings renderer_settings = 1;
    repeated LoggerSettings loggers = 2;
    GeneralSettings general_settings = 3;
    ResourceCacheSettings resource_cache_settings = 4;
}

message GeneralSettings {
    uint32 event_manager_queue_count = 1;
}

message ResourceCacheSettings {
    uint32 cache_size_in_mb = 1;
    repeated string store_locations = 2;
}

message RendererSettings {
    string renderer_type = 1;
    Fraction frame_rate = 2;
    string background_color = 3;
    bool full_screen = 4;
    RectSize resolution = 5;
}

message LoggerSettings {
    string type = 1;
    string level = 2;

    oneof type_settings {
        FileLoggerSettings file_logger_settings = 3;
    }
}

message FileLoggerSettings {
    string root_dir = 1;
    bool use_single_file = 2;
}
