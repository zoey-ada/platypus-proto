syntax = "proto3";

package platypus;

message Settings {
    RendererSettings renderer_settings = 1;
    repeated LoggerSettings loggers = 2;
}

message RendererSettings {
    string renderer_type = 1;
    Fraction frame_rate = 2;
    string background_color = 3;
    bool full_screen = 4;
    RectSize resolution = 5;
}

message RectSize {
    uint32 height = 1;
    uint32 width = 2;
}

message Fraction {
    int32 numerator = 1;
    int32 denominator = 2;
}

message LoggerSettings {
    string type = 1;
    string level = 2;

    oneof type_settings {
        FileLoggerSettings file_logger_settings = 3;
    }
}

message FileLoggerSettings {
    string root_dir = 1;
    bool use_single_file = 2;
}
